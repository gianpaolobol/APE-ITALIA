name: Deploy staging server

# Deploys main to the staging VM over SSH: pulls the repository, writes deploy/.env from a secret and
# runs the docker-compose stack (Postgres, ClamAV, migrations, API, worker, web, Caddy TLS).
# Required secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY (private key), DEPLOY_ENV_FILE (deploy/.env content).
# Optional variable: DEPLOY_PATH (default /opt/ape-italia). See docs/DEPLOYMENT.md.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  release-gate:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/release-ci-gate.yml
  deploy:
    needs: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_SECRETS: ${{ secrets.DEPLOY_HOST != '' && secrets.DEPLOY_USER != '' && secrets.DEPLOY_SSH_KEY != '' && secrets.DEPLOY_ENV_FILE != '' }}
    steps:
      - name: Check configuration
        if: env.HAS_SECRETS != 'true'
        run: |
          echo "::error::Missing DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY / DEPLOY_ENV_FILE secrets (see docs/DEPLOYMENT.md)"
          exit 1
      - name: SSH key
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -T 15 "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Deploy
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          ENV_FILE: ${{ secrets.DEPLOY_ENV_FILE }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/ape-italia' }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SSH="ssh -i $HOME/.ssh/id_deploy -o BatchMode=yes $USER@$HOST"
          $SSH "set -e; if [ ! -d '$DEPLOY_PATH/.git' ]; then sudo mkdir -p '$DEPLOY_PATH' && sudo chown \$(id -u):\$(id -g) '$DEPLOY_PATH' && git clone https://github.com/$REPO '$DEPLOY_PATH'; fi; cd '$DEPLOY_PATH' && git fetch --quiet origin && git checkout --quiet --force '$SHA'"
          printf '%s\n' "$ENV_FILE" | $SSH "umask 077; cat > '$DEPLOY_PATH/deploy/.env'"
          $SSH "cd '$DEPLOY_PATH' && docker compose -f deploy/docker-compose.staging.yml --env-file deploy/.env up -d --build --remove-orphans && docker image prune -f >/dev/null"
      - name: Health check
        env:
          ENV_FILE: ${{ secrets.DEPLOY_ENV_FILE }}
        run: |
          set -euo pipefail
          URL=$(printf '%s\n' "$ENV_FILE" | sed -n 's/^PUBLIC_API_URL=//p' | tr -d '\r')
          [ -n "$URL" ] || { echo "PUBLIC_API_URL not set: skipping public check"; exit 0; }
          for i in $(seq 1 30); do curl -fsS "$URL/health" && exit 0; sleep 10; done
          echo "::error::API not healthy at $URL/health"; exit 1
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_deploy
