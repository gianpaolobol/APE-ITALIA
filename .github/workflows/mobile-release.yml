name: Mobile release (TestFlight / Google Play internal)

# Manual run (Actions → "Mobile release" → Run workflow) or a tag like mobile-v0.1.0.
# Without signing secrets the jobs still compile the native apps (unsigned) to verify the build;
# with secrets they sign and upload. Required secrets and one-time setup: docs/MOBILE_RELEASE.md.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Piattaforma'
        type: choice
        options: [both, android, ios]
        default: both
      play_status:
        description: 'Stato della release su Google Play (draft finché l''app non ha una prima release pubblicata)'
        type: choice
        options: [completed, draft]
        default: completed
  push:
    tags: ['mobile-v*']

permissions:
  contents: read

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUILD_NUMBER: ${{ github.run_number }}
  # Public (non-secret) app configuration, from repository Variables. Empty = demo mode without uploads.
  EXPO_PUBLIC_API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL }}
  EXPO_PUBLIC_OIDC_ISSUER: ${{ vars.EXPO_PUBLIC_OIDC_ISSUER }}
  EXPO_PUBLIC_OIDC_CLIENT_ID: ${{ vars.EXPO_PUBLIC_OIDC_CLIENT_ID }}
  EXPO_PUBLIC_OIDC_AUDIENCE: ${{ vars.EXPO_PUBLIC_OIDC_AUDIENCE }}

jobs:
  android:
    if: github.event_name == 'push' || inputs.platform != 'ios'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci --no-audit --no-fund
      - name: Native project (expo prebuild)
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install --clean
      - name: Upload key
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Build release bundle (AAB)
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon --stacktrace
      - name: Check signature
        run: |
          AAB=apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          ls -l "$AAB"
          keytool -printcert -jarfile "$AAB" | grep -E "Owner|SHA256:" | head -3
          if [ "$HAS_KEYSTORE" = true ] && keytool -printcert -jarfile "$AAB" | grep -q "CN=Android Debug"; then echo "Release signed with the debug key"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: android-aab-${{ github.run_number }}${{ env.HAS_KEYSTORE == 'true' && '' || '-UNSIGNED-debugkey' }}
          path: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
      - name: Upload to Google Play (internal testing)
        if: env.HAS_KEYSTORE == 'true' && env.HAS_PLAY == 'true'
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: it.apeitalia.app
          releaseFiles: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: ${{ inputs.play_status || 'completed' }}
      - name: Summary
        run: |
          {
            echo "### Android build ${BUILD_NUMBER}"
            if [ "$HAS_KEYSTORE" != true ]; then echo "- Compilato **senza firma di rilascio** (secret mancanti): solo verifica."
            elif [ "$HAS_PLAY" != true ]; then echo "- Firmato; caricamento su Google Play saltato (manca PLAY_SERVICE_ACCOUNT_JSON). Scarica l'AAB dagli artifact."
            else echo "- Firmato e caricato sul canale **internal** di Google Play."; fi
          } >> "$GITHUB_STEP_SUMMARY"

  ios:
    if: github.event_name == 'push' || inputs.platform != 'android'
    runs-on: macos-15
    timeout-minutes: 90
    env:
      HAS_ASC: ${{ secrets.ASC_KEY_P8_BASE64 != '' && secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Native project (expo prebuild)
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --no-install --clean
      - name: CocoaPods
        working-directory: apps/mobile/ios
        run: pod install
      - name: Compile for simulator (verification without signing)
        if: env.HAS_ASC != 'true'
        working-directory: apps/mobile/ios
        run: |
          set -o pipefail
          xcodebuild -workspace APEItalia.xcworkspace -scheme APEItalia -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -40
      - name: App Store Connect API key
        if: env.HAS_ASC == 'true'
        env:
          KEY_B64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
      - name: Archive (automatic signing via API key)
        if: env.HAS_ASC == 'true'
        working-directory: apps/mobile/ios
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          xcodebuild -workspace APEItalia.xcworkspace -scheme APEItalia -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/APEItalia.xcarchive" \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic archive | tail -60
      - name: Export and upload to TestFlight
        if: env.HAS_ASC == 'true'
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/APEItalia.xcarchive" -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" | tail -40
      - name: Remove API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
      - name: Summary
        run: |
          {
            echo "### iOS build ${BUILD_NUMBER}"
            if [ "$HAS_ASC" != true ]; then echo "- Compilato per simulatore **senza firma** (secret App Store Connect mancanti): solo verifica."
            else echo "- Archiviato, firmato e inviato ad App Store Connect: comparirà in **TestFlight** dopo l'elaborazione di Apple (di solito 5–30 minuti)."; fi
          } >> "$GITHUB_STEP_SUMMARY"
