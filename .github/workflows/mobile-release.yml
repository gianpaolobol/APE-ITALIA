name: Mobile release (TestFlight / Firebase App Distribution / Google Play)

# Manual run on current validated main only (Actions → "Mobile release" → Run workflow).
# Default build-only mode uses demo configuration and no signing credentials or store uploads.
# Explicit distribute mode may sign and upload to test channels only. See docs/MOBILE_RELEASE.md.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Build locale di verifica (nessun upload agli store) oppure distribuzione di test esplicita'
        type: choice
        options: [build-only, distribute]
        default: build-only
      platform:
        description: 'Piattaforma (Android: Firebase App Distribution, più Google Play se configurato)'
        type: choice
        options: [both, android, ios]
        default: both
      play_status:
        description: 'Stato della release su Google Play (draft finché l''app non ha una prima release pubblicata)'
        type: choice
        options: [completed, draft]
        default: completed

permissions:
  contents: read

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUILD_NUMBER: ${{ github.run_number }}
  # Public (non-secret) app configuration, from repository Variables. Empty = demo mode without uploads.
  EXPO_PUBLIC_API_BASE_URL: ${{ inputs.mode == 'distribute' && vars.EXPO_PUBLIC_API_BASE_URL || '' }}
  EXPO_PUBLIC_OIDC_ISSUER: ${{ inputs.mode == 'distribute' && vars.EXPO_PUBLIC_OIDC_ISSUER || '' }}
  EXPO_PUBLIC_OIDC_CLIENT_ID: ${{ inputs.mode == 'distribute' && vars.EXPO_PUBLIC_OIDC_CLIENT_ID || '' }}
  EXPO_PUBLIC_OIDC_AUDIENCE: ${{ inputs.mode == 'distribute' && vars.EXPO_PUBLIC_OIDC_AUDIENCE || '' }}

jobs:
  release-gate:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/release-ci-gate.yml
  android:
    needs: release-gate
    if: inputs.platform != 'ios'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write   # keyless Google auth (Workload Identity Federation)
    env:
      HAS_KEYSTORE: ${{ inputs.mode == 'distribute' && secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_PLAY: ${{ inputs.mode == 'distribute' && secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
      HAS_FIREBASE: ${{ inputs.mode == 'distribute' && secrets.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Firebase configuration (keyless)
        if: inputs.mode == 'distribute'
        run: |
          set -euo pipefail
          if [ -f deploy/firebase/config.json ]; then
            field() {
              jq -er --arg key "$1" '.[$key] | select(type == "string" and length > 0 and (test("[[:cntrl:][:space:]]") | not))' deploy/firebase/config.json
            }
            PROJECT=$(field projectId)
            APP=$(field androidAppId)
            SA=$(field serviceAccount)
            PROVIDER=$(field workloadIdentityProvider)
            GROUP=$(field testerGroup)
            {
              echo "FB_PROJECT=$PROJECT"
              echo "FB_APP=$APP"
              echo "FB_SA=$SA"
              echo "FB_PROVIDER=$PROVIDER"
              echo "FB_GROUP=$GROUP"
            } >> "$GITHUB_ENV"
          fi
      - name: Require Android test distribution configuration
        if: inputs.mode == 'distribute'
        run: |
          set -euo pipefail
          if [ "$HAS_PLAY" = true ] && [ "$HAS_KEYSTORE" != true ]; then
            echo "::error::Play internal is configured but the upload key is missing"
            exit 1
          fi
          if [ "$HAS_FIREBASE" != true ] && [ -z "${FB_PROVIDER:-}" ] && [ "$HAS_PLAY" != true ]; then
            echo "::error::No Android test distribution destination is configured"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify staging-only mobile configuration
        if: inputs.mode == 'distribute'
        env:
          EXPECTED_STAGING_API: ${{ vars.STAGING_PUBLIC_API_URL }}
          EXPECTED_STAGING_OIDC: ${{ vars.STAGING_PUBLIC_OIDC_ISSUER }}
        run: node scripts/verify-mobile-test-config.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci --no-audit --no-fund
      - name: Native project (expo prebuild)
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install --clean
      - name: Upload key
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Build release bundle (AAB, Google Play) and APK (Firebase App Distribution)
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ inputs.mode == 'distribute' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ inputs.mode == 'distribute' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ inputs.mode == 'distribute' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace
      - name: Check signature
        run: |
          AAB=apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          ls -l "$AAB"
          keytool -printcert -jarfile "$AAB" | grep -E "Owner|SHA256:" | head -3
          if [ "$HAS_KEYSTORE" = true ] && keytool -printcert -jarfile "$AAB" | grep -q "CN=Android Debug"; then echo "Release signed with the debug key"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'build-only'
        with:
          name: android-apk-${{ github.run_number }}
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
          if-no-files-found: error
      - name: Google authentication via Workload Identity Federation
        if: inputs.mode == 'distribute' && env.FB_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.FB_PROVIDER }}
          service_account: ${{ env.FB_SA }}
      - name: Distribute APK with Firebase App Distribution (keyless)
        if: inputs.mode == 'distribute' && env.FB_PROVIDER != ''
        run: |
          set -o pipefail
          NOTES="APE Italia build ${BUILD_NUMBER} ($(git rev-parse --short HEAD)) — prova interna, dati solo sintetici."
          npx --yes firebase-tools@14 --non-interactive --project "$FB_PROJECT" appdistribution:distribute \
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk --app "$FB_APP" --groups "$FB_GROUP" --release-notes "$NOTES" \
            2>&1 | grep -v 'app-binary-downloads'   # public repo: do not log the signed 1-hour download link
          echo "FIREBASE_APP_ID=$FB_APP" >> "$GITHUB_ENV"
          echo "HAS_FIREBASE=true" >> "$GITHUB_ENV"
      - name: Distribute APK with Firebase App Distribution (service account key)
        if: inputs.mode == 'distribute' && env.HAS_FIREBASE == 'true' && env.FB_PROVIDER == ''
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TESTERS: ${{ vars.FIREBASE_TESTERS }}
        run: |
          set -euo pipefail
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/firebase-sa.json"
          chmod 600 "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          PROJECT=$(jq -r .project_id "$RUNNER_TEMP/firebase-sa.json")
          FB="npx --yes firebase-tools@14 --non-interactive --project $PROJECT"
          # Register the Android app in the Firebase project on first use (idempotent).
          APP_ID=$($FB apps:list ANDROID --json | jq -r '.result[]? | select(.packageName=="it.apeitalia.app") | .appId' | head -1)
          if [ -z "$APP_ID" ]; then
            APP_ID=$($FB apps:create ANDROID "APE Italia" --package-name it.apeitalia.app --json | jq -r '.result.appId')
            echo "Registered Firebase Android app $APP_ID"
          fi
          NOTES="APE Italia build ${BUILD_NUMBER} ($(git rev-parse --short HEAD)) — prova interna, dati solo sintetici."
          ARGS=(appdistribution:distribute apps/mobile/android/app/build/outputs/apk/release/app-release.apk --app "$APP_ID" --release-notes "$NOTES")
          if [ -n "${TESTERS:-}" ]; then ARGS+=(--testers "$TESTERS"); fi
          set -o pipefail
          $FB "${ARGS[@]}" 2>&1 | grep -v 'app-binary-downloads'
          echo "FIREBASE_APP_ID=$APP_ID" >> "$GITHUB_ENV"
      - name: Remove Firebase credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-sa.json"
      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'build-only'
        with:
          name: android-aab-${{ github.run_number }}-debugkey
          path: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7
          if-no-files-found: error
      - name: Upload to Google Play (internal testing)
        if: inputs.mode == 'distribute' && env.HAS_KEYSTORE == 'true' && env.HAS_PLAY == 'true'
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: it.apeitalia.app
          releaseFiles: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: ${{ inputs.play_status || 'completed' }}
      - name: Remove upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
      - name: Summary
        run: |
          {
            echo "### Android build ${BUILD_NUMBER}"
            if [ "$HAS_KEYSTORE" = true ]; then echo "- Firmato con la chiave di caricamento."; else echo "- Firmato con la chiave di debug del progetto (sufficiente per i tester Firebase, non per Google Play)."; fi
            if [ "${{ inputs.mode }}" = build-only ]; then echo "- Modalità build-only: nessuna distribuzione Firebase o Play."; elif [ "$HAS_FIREBASE" = true ]; then echo "- APK distribuito con **Firebase App Distribution** (app \`${FIREBASE_APP_ID:-?}\`): i tester ricevono l'email di invito."; else echo "- Firebase saltato: manca il secret FIREBASE_SERVICE_ACCOUNT_JSON."; fi
            if [ "$HAS_KEYSTORE" = true ] && [ "$HAS_PLAY" = true ]; then echo "- AAB caricato sul canale **internal** di Google Play."; fi
            if [ "${{ inputs.mode }}" = distribute ]; then echo "- Nessun APK/AAB di distribuzione pubblicato come artifact GitHub."; fi
          } >> "$GITHUB_STEP_SUMMARY"

  ios:
    needs: release-gate
    if: inputs.platform != 'android'
    runs-on: macos-15
    timeout-minutes: 90
    env:
      HAS_ASC: ${{ inputs.mode == 'distribute' && (secrets.ASC_KEY_P8 != '' || secrets.ASC_KEY_P8_BASE64 != '') && secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - name: Require TestFlight configuration
        if: inputs.mode == 'distribute' && env.HAS_ASC != 'true'
        run: |
          echo "::error::TestFlight distribution requires App Store Connect signing configuration"
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify staging-only mobile configuration
        if: inputs.mode == 'distribute'
        env:
          EXPECTED_STAGING_API: ${{ vars.STAGING_PUBLIC_API_URL }}
          EXPECTED_STAGING_OIDC: ${{ vars.STAGING_PUBLIC_OIDC_ISSUER }}
        run: node scripts/verify-mobile-test-config.mjs
      - name: Xcode 26 (App Store Connect requires the iOS 26 SDK or later)
        run: |
          set -euo pipefail
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -viE 'beta|rc' | sort -V | tail -1 || true)
          [ -n "$XC" ] || XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          [ -n "$XC" ] || { echo "::error::No Xcode 26 on this runner image"; ls -d /Applications/Xcode*.app; exit 1; }
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - run: npm ci --no-audit --no-fund
      - name: Native project (expo prebuild)
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --no-install --clean
      - name: Verify generated iOS data protection entitlement
        run: python3 scripts/check-ios-protection.py apps/mobile/ios/APEItalia
      - name: CocoaPods
        working-directory: apps/mobile/ios
        run: pod install
      - name: Compile for simulator (verification without signing)
        if: env.HAS_ASC != 'true'
        working-directory: apps/mobile/ios
        run: |
          set -o pipefail
          xcodebuild -workspace APEItalia.xcworkspace -scheme APEItalia -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -40
      - name: App Store Connect API key
        if: inputs.mode == 'distribute' && env.HAS_ASC == 'true'
        env:
          KEY_PEM: ${{ secrets.ASC_KEY_P8 }}
          KEY_B64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          umask 077
          # ASC_KEY_P8: the .p8 text pasted as-is (easy from an iPhone); ASC_KEY_P8_BASE64: base64 of the file.
          if [ -n "$KEY_PEM" ]; then printf '%s\n' "$KEY_PEM" | tr -d '\r' > "$RUNNER_TEMP/AuthKey.p8"
          else echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"; fi
          grep -q 'BEGIN PRIVATE KEY' "$RUNNER_TEMP/AuthKey.p8" || { echo "::error::The App Store Connect key is not a .p8 private key"; exit 1; }
      - name: Archive (automatic signing via API key)
        if: inputs.mode == 'distribute' && env.HAS_ASC == 'true'
        working-directory: apps/mobile/ios
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          archive() {
            xcodebuild -workspace APEItalia.xcworkspace -scheme APEItalia -configuration Release \
              -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/APEItalia.xcarchive" \
              DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" archive | tail -60
          }
          # hermes-engine's "Copy XCFrameworks" phase occasionally races on fresh runners: retry once.
          archive || { echo "::warning::archive failed, retrying once"; archive; }
          # The archive is left unsigned on purpose: automatic signing at archive time needs a development
          # profile, which Apple only issues when the team has registered devices. The export step below
          # signs for App Store distribution (cloud-managed certificate, no devices needed).
      - name: Export and upload to TestFlight
        if: inputs.mode == 'distribute' && env.HAS_ASC == 'true'
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/APEItalia.xcarchive" -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" | tail -40
      - name: Remove API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
      - name: Summary
        run: |
          {
            echo "### iOS build ${BUILD_NUMBER}"
            if [ "${{ inputs.mode }}" = build-only ]; then echo "- Compilato per simulatore senza firma, in modalità build-only: nessun upload TestFlight."; elif [ "$HAS_ASC" != true ]; then echo "- Distribuzione TestFlight non configurata."; exit 1
            else echo "- Archiviato, firmato e inviato ad App Store Connect: comparirà in **TestFlight** dopo l'elaborazione di Apple (di solito 5–30 minuti)."; fi
          } >> "$GITHUB_STEP_SUMMARY"
