name: TestFlight internal testers

# Read-only verification of an explicit signed iOS upload on current main.
on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: 'Mobile release run ID with successful signed iOS upload'
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  testers:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_ASC: ${{ (secrets.ASC_KEY_P8 != '' || secrets.ASC_KEY_P8_BASE64 != '') && secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact signed iOS upload
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$RELEASE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID" > "$work/run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID/jobs?filter=latest&per_page=100" > "$work/jobs.json"
          build=$(node scripts/verify-testflight-upload.mjs "$work/run.json" "$work/jobs.json" "$GITHUB_SHA")
          echo "EXPECTED_BUILD_NUMBER=$build" >> "$GITHUB_ENV"
      - name: Require App Store Connect configuration
        if: env.HAS_ASC != 'true'
        run: |
          echo "::error::Missing App Store Connect configuration"
          exit 1
      - name: Verify TestFlight internal prerequisites
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          pip install --quiet 'pyjwt[crypto]==2.10.1'
          python3 scripts/release/testflight_internal.py
