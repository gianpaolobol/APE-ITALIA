name: Validate starter
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ape
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: ape_italia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ape -d ape_italia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ape:ci_only_password@localhost:5432/ape_italia?schema=public
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: node scripts/check-secrets.mjs
      - run: python3 scripts/check-ios-protection.test.py
      - run: node --test scripts/verify-release-ci.test.mjs scripts/verify-staging-config.test.mjs scripts/check-mobile-build-mode.test.mjs scripts/verify-staging-health.test.mjs
      - name: Dependency audit (critical threshold; residual findings require review)
        run: npm audit --omit=dev --audit-level=critical
      - run: npm exec --workspace @ape/api -- prisma validate
      - run: npm run db:generate -w @ape/api
      - run: npm exec --workspace @ape/api -- prisma migrate deploy
      - run: npm exec --workspace @ape/api -- prisma migrate status
      - name: Detect drift between schema.prisma and SQL migrations
        run: |
          PGPASSWORD=ci_only_password psql -h localhost -U ape -d ape_italia -c 'CREATE DATABASE ape_shadow'
          npm exec --workspace @ape/api -- prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url postgresql://ape:ci_only_password@localhost:5432/ape_shadow --exit-code
      - run: npm run typecheck -w @ape/api
      - run: npm run build -w @ape/api
      - name: Require media tools for video privacy and frame tests
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - run: npm run test -w @ape/api
        env:
          RUN_DB_INTEGRATION: '1'
      - name: API end-to-end (compiled server, HTTPS JWKS, PostgreSQL)
        run: npm run test -w @ape/api -- e2e
        env:
          RUN_E2E: '1'
      - run: npm run typecheck -w @ape/mobile
      - run: npm run test -w @ape/mobile
      - run: npm run bundle:check -w @ape/mobile
      - name: Verify generated Android backup policy
        working-directory: apps/mobile
        run: |
          npx expo prebuild --platform android --no-install --clean
          python3 ../../scripts/check-android-backup.py android/app/src/main
      - run: npm run test -w @ape/web
      - run: npm run build -w @ape/web
      - name: Web portal end-to-end in Chrome (fake OIDC + stub API)
        run: npm run test -w @ape/web -- e2e
        env:
          RUN_WEB_E2E: '1'
          CHROME_PATH: /usr/bin/google-chrome
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images and smoke-test the staging stack (synthetic secrets)
        run: |
          gen() { node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"; }
          {
            echo "POSTGRES_PASSWORD=ci_only_$(openssl rand -hex 8)"
            echo "EVIDENCE_ENCRYPTION_KEY=$(gen)"
            echo "WEB_SESSION_KEY=$(gen)"
          } > deploy/.env
          APE_BUILD_REVISION="$GITHUB_SHA" docker compose -f deploy/docker-compose.staging.yml --env-file deploy/.env up -d --build
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:3001/health >/dev/null && break; sleep 2; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/health)" = 200
          curl -fs http://127.0.0.1:3001/health | node scripts/verify-staging-health.mjs "$GITHUB_SHA"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/v1/me)" = 401
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:3000/ >/dev/null && break; sleep 2; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/)" = 200
          # Exercise the actual Caddy-to-web route, not just the loopback Next.js port.
          docker compose -f deploy/docker-compose.staging.yml --env-file deploy/.env exec -T caddy wget -qO- http://localhost:8080/ | grep -F 'Portale web' >/dev/null
          # The standalone portal must not expose the on-demand image optimizer.
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:3000/_next/image?url=%2F&w=640&q=75')" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/auth/login)" = 503
          docker compose -f deploy/docker-compose.staging.yml --env-file deploy/.env ps
          test "$(docker compose -f deploy/docker-compose.staging.yml --env-file deploy/.env ps -a --format '{{.Service}} {{.ExitCode}}' | grep '^migrate ' | cut -d' ' -f2)" = 0
          docker compose -f deploy/docker-compose.staging.yml --env-file deploy/.env logs worker | grep -q '\[worker\] expire-offers ok'
          docker compose -f deploy/docker-compose.staging.yml --env-file deploy/.env exec -T api id -u | grep -vq '^0$'
      - name: Inventory selected advisory packages in final runtime images
        run: |
          C="docker compose -f deploy/docker-compose.staging.yml --env-file deploy/.env"
          for service in api worker; do
            $C exec -T "$service" node -e "require('@prisma/client'); for (const name of ['prisma','@nestjs/cli','vitest']) { try { require.resolve(name + '/package.json'); } catch (e) { if (e.code === 'MODULE_NOT_FOUND') continue; throw e; } throw Error('Unexpected development dependency: ' + name); }"
          done
          for service in api worker web; do
            echo "Runtime package inventory: $service"
            $C exec -T "$service" node --input-type=module - /app < scripts/inventory-runtime-deps.mjs
          done
      - name: Backup, destroy, restore and verify (synthetic data)
        run: |
          C="docker compose -f deploy/docker-compose.staging.yml --env-file deploy/.env"
          $C exec -T api node dist/admin/provision-cli.js create-organization --name "Synthetic Backup Org" --owner-subject synthetic-backup-owner --operator ci-backup
          $C exec -T api sh -c 'mkdir -p /var/lib/ape-italia/evidence/org && echo synthetic-marker > /var/lib/ape-italia/evidence/org/marker'
          STAMP=$(deploy/backup.sh /tmp/ape-backup | tail -1)
          ls -l /tmp/ape-backup
          $C down -v
          $C up -d
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:3001/health >/dev/null && break; sleep 2; done
          test "$($C exec -T postgres psql -U ape -d ape_italia -tAc "select count(*) from \"Organization\" where name='Synthetic Backup Org'")" = 0
          if deploy/restore.sh /tmp/ape-backup "$STAMP"; then echo "restore without --yes must fail"; exit 1; fi
          deploy/restore.sh /tmp/ape-backup "$STAMP" --yes
          test "$($C exec -T postgres psql -U ape -d ape_italia -tAc "select count(*) from \"Organization\" where name='Synthetic Backup Org'")" = 1
          test "$($C exec -T postgres psql -U ape -d ape_italia -tAc "select count(*) from \"AuditEvent\" where \"actorId\"='operator:ci-backup'")" = 2
          test "$($C exec -T api cat /var/lib/ape-italia/evidence/org/marker)" = synthetic-marker
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:3001/health >/dev/null && break; sleep 2; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/v1/me)" = 401
      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.staging.yml --env-file deploy/.env logs --no-color | tail -200
      - name: Tear down
        if: always()
        run: docker compose -f deploy/docker-compose.staging.yml --env-file deploy/.env down -v
  keycloak-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ape
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: ape_italia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ape -d ape_italia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ape:ci_only_password@localhost:5432/ape_italia?schema=public
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run db:generate -w @ape/api
      - run: npm exec --workspace @ape/api -- prisma migrate deploy
      - run: npm run build -w @ape/api
      - run: npm run build -w @ape/web
      - name: Start Keycloak over HTTPS with the development realm
        run: |
          mkdir -p /tmp/kc
          openssl req -x509 -newkey rsa:2048 -nodes -keyout /tmp/kc/k.pem -out /tmp/kc/c.pem -subj /CN=localhost -days 1 -addext subjectAltName=DNS:localhost,IP:127.0.0.1
          chmod 644 /tmp/kc/*.pem
          echo "KEYCLOAK_ADMIN_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
      - run: |
          docker run -d --name kc -p 8443:8443 -v /tmp/kc:/certs:ro -v "$PWD/deploy/keycloak:/opt/keycloak/data/import:ro" \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD="$KEYCLOAK_ADMIN_PASSWORD" \
            quay.io/keycloak/keycloak:26.0 start-dev --import-realm --http-enabled=false \
            --https-certificate-file=/certs/c.pem --https-certificate-key-file=/certs/k.pem --hostname=https://localhost:8443
          for i in $(seq 1 90); do curl -fsk https://localhost:8443/realms/ape-italia/.well-known/openid-configuration >/dev/null && break; sleep 2; done
          curl -fsk https://localhost:8443/realms/ape-italia/.well-known/openid-configuration | head -c 300
      - name: End-to-end with Keycloak, compiled API, portal and Chrome
        run: npm run test -w @ape/api -- keycloak
        env:
          RUN_KEYCLOAK_E2E: '1'
          KEYCLOAK_URL: https://localhost:8443
          KC_CERT_DIR: /tmp/kc
          NODE_EXTRA_CA_CERTS: /tmp/kc/c.pem
          CHROME_PATH: /usr/bin/google-chrome
      - name: Keycloak logs on failure
        if: failure()
        run: docker logs kc 2>&1 | tail -80
  clamav:
    runs-on: ubuntu-latest
    services:
      clamav:
        image: clamav/clamav:stable
        ports:
          - 3310:3310
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Wait for clamd (signature download can take a few minutes)
        run: for i in $(seq 1 120); do (printf 'zPING\0'; sleep 1) | nc -q 2 127.0.0.1 3310 2>/dev/null | grep -q PONG && exit 0; sleep 3; done; exit 1
      - run: npm run test -w @ape/api -- clamav-live
        env:
          RUN_CLAMAV: '1'
          CLAMAV_HOST: 127.0.0.1

