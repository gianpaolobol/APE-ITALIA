name: Validate starter
on:
  push:
    branches: [main, feat/sprint-1-persistence]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run db:generate -w @ape/api
      - run: npm run typecheck -w @ape/api
      - run: npm run build -w @ape/web
        env:
          NEXT_TELEMETRY_DISABLED: '1'
