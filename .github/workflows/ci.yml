name: Validate starter
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ape
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: ape_italia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ape -d ape_italia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ape:ci_only_password@localhost:5432/ape_italia?schema=public
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: node scripts/check-secrets.mjs
      - name: Dependency audit (report only; see docs/SECURITY.md for accepted residual risk)
        run: npm audit --omit=dev --audit-level=critical
      - run: npm exec --workspace @ape/api -- prisma validate
      - run: npm run db:generate -w @ape/api
      - run: npm exec --workspace @ape/api -- prisma migrate deploy
      - run: npm exec --workspace @ape/api -- prisma migrate status
      - name: Detect drift between schema.prisma and SQL migrations
        run: |
          PGPASSWORD=ci_only_password psql -h localhost -U ape -d ape_italia -c 'CREATE DATABASE ape_shadow'
          npm exec --workspace @ape/api -- prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url postgresql://ape:ci_only_password@localhost:5432/ape_shadow --exit-code
      - run: npm run typecheck -w @ape/api
      - run: npm run build -w @ape/api
      - run: npm run test -w @ape/api
        env:
          RUN_DB_INTEGRATION: '1'
      - run: npm run typecheck -w @ape/mobile
      - run: npm run test -w @ape/mobile
      - run: npm run bundle:check -w @ape/mobile
      - run: npm run test -w @ape/web
      - run: npm run build -w @ape/web
