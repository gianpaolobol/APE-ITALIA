name: Isolated combined npm remediation and lock capture
on:
  push:
    branches: [diagnostics/npm-remediation-20261128]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  combined:
    if: github.ref == 'refs/heads/diagnostics/npm-remediation-20261128'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgresql://ape:ci_only_password@localhost:5432/ape_italia?schema=public
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 26d8f68eff0dd0d01bc423d1ecf076e1e9d008f8
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce both individually verified scoped overrides together
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          npm audit --omit=dev --json > /tmp/ape-before.json || test -s /tmp/ape-before.json
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const manifest=JSON.parse(fs.readFileSync('package.json','utf8'));
          manifest.overrides ??= {};
          for (const [parent,override] of Object.entries({
            'next@15.5.29': {postcss:'8.5.23'},
            '@expo/metro-config@54.0.17': {postcss:'8.5.23'},
            '@prisma/config@6.19.3': {effect:'3.22.1'}
          })) {
            if (manifest.overrides[parent] !== undefined) throw new Error('Existing override '+parent);
            manifest.overrides[parent]=override;
          }
          fs.writeFileSync('package.json',JSON.stringify(manifest,null,2)+'\n');
          JS
          npm update postcss effect --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit --omit=dev --json > /tmp/ape-after.json || test -s /tmp/ape-after.json
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const before=JSON.parse(fs.readFileSync('/tmp/ape-before.json','utf8'));
          const after=JSON.parse(fs.readFileSync('/tmp/ape-after.json','utf8'));
          for (const [phase,report] of [['before',before],['after',after]]) {
            if (!report.metadata?.vulnerabilities || report.error) throw new Error('Missing audit '+phase);
            console.log(phase,JSON.stringify(report.metadata.vulnerabilities));
          }
          for (const [name,v] of Object.entries(after.vulnerabilities??{})) {
            console.log('residual',name,JSON.stringify({severity:v.severity,range:v.range,nodes:v.nodes,via:v.via.map(x=>typeof x==='string'?x:{source:x.source,range:x.range,severity:x.severity,url:x.url}),fixAvailable:v.fixAvailable}));
          }
          for (const target of ['postcss','effect']) if(after.vulnerabilities?.[target]) throw new Error('Target remains flagged '+target);
          if(Object.keys(after.vulnerabilities??{}).some(k=>!before.vulnerabilities?.[k])) throw new Error('New audit finding');
          if(after.metadata.vulnerabilities.high>before.metadata.vulnerabilities.high || after.metadata.vulnerabilities.critical>before.metadata.vulnerabilities.critical) throw new Error('Severity increased');
          const a=JSON.parse(execFileSync('git',['show','HEAD:package-lock.json'],{encoding:'utf8',maxBuffer:20*1024*1024})).packages;
          const b=JSON.parse(fs.readFileSync('package-lock.json','utf8')).packages;
          for(const k of new Set([...Object.keys(a),...Object.keys(b)])) if(a[k]?.version!==b[k]?.version) console.log('lock change',k,a[k]?.version??'-','=>',b[k]?.version??'-');
          JS
          git diff --check
          git diff --stat -- package.json package-lock.json
          # Both inputs are public repository source files. Emit only this bounded generated patch, no environment or credentials.
          git diff -- package.json package-lock.json > /tmp/ape-remediation.patch
          test "$(wc -c < /tmp/ape-remediation.patch)" -le 100000
          sha256sum package.json package-lock.json /tmp/ape-remediation.patch
          echo APE_PATCH_BEGIN
          base64 -w 100 /tmp/ape-remediation.patch
          echo APE_PATCH_END
          npm ci --ignore-scripts --no-audit --no-fund
          for target in postcss effect glob minimatch image-size deepmerge-ts; do
            npm ls "$target" --all || true
          done
      - name: Combined backend checks
        run: |
          npm exec --workspace @ape/api -- prisma validate
          npm run db:generate -w @ape/api
          npm run typecheck -w @ape/api
          npm run build -w @ape/api
      - name: Combined web and mobile checks (not native builds)
        run: |
          npm run test -w @ape/web
          npm run build -w @ape/web
          npm run test -w @ape/mobile
          npm run bundle:check -w @ape/mobile
