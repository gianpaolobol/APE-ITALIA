services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ape
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: ape_italia
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ape_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ape -d ape_italia"]
      interval: 5s
      retries: 10
volumes:
  ape_pgdata:
