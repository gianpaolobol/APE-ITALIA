# Full stack for a pilot/staging host. Secrets come from deploy/.env (never committed; see .env.example).
#   docker compose -f deploy/docker-compose.staging.yml --env-file deploy/.env up -d --build
# TLS termination (HTTPS) must be provided by a reverse proxy in front of api and web.
services:
  # TLS reverse proxy (automatic Let's Encrypt certificates) in front of the API.
  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment:
      API_DOMAIN: ${API_DOMAIN:-localhost}
      WEB_DOMAIN: ${WEB_DOMAIN:-http://localhost:8080}
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, caddy_data:/data]
    depends_on: [api, web]
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ape
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ape_italia
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ape -d ape_italia"], interval: 5s, retries: 20 }
    restart: unless-stopped
  clamav:
    image: clamav/clamav:stable
    healthcheck: { test: ["CMD", "clamdcheck.sh"], interval: 15s, retries: 40, start_period: 120s }
    restart: unless-stopped
  migrate:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
      target: migration
    image: ape-italia-migrate
    command: ["node", "/app/node_modules/prisma/build/index.js", "migrate", "deploy"]
    environment: &db { DATABASE_URL: "postgresql://ape:${POSTGRES_PASSWORD}@postgres:5432/ape_italia?schema=public" }
    depends_on: { postgres: { condition: service_healthy } }
    restart: "no"
  api:
    build: &api_runtime_build
      context: ..
      dockerfile: services/api/Dockerfile
      target: runtime
      args:
        APE_BUILD_REVISION: ${APE_BUILD_REVISION:-unknown}
    image: ape-italia-api
    environment:
      <<: *db
      PORT: "3001"
      TRUST_PROXY: ${TRUST_PROXY:-1}
      RATE_LIMIT_STORE: postgres
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-ape-italia-api}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
      EVIDENCE_STORAGE_DIR: /var/lib/ape-italia/evidence
      EVIDENCE_ENCRYPTION_KEY: ${EVIDENCE_ENCRYPTION_KEY:-}
      CLAMAV_HOST: clamav
      # Email-code login, notifications, AI reading, payments (each feature stays off when unset).
      PLATFORM_JWT_SECRET: ${PLATFORM_JWT_SECRET:-}
      MAILER: ${MAILER:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      SURVEY_PHOTO_READER: ${SURVEY_PHOTO_READER:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_VISION_MODEL: ${ANTHROPIC_VISION_MODEL:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      UPLOAD_TMP_DIR: /var/lib/ape-italia/uploads
    volumes: [evidence:/var/lib/ape-italia/evidence, uploads:/var/lib/ape-italia/uploads]
    ports: ["127.0.0.1:3001:3001"]
    depends_on: { migrate: { condition: service_completed_successfully } }
    restart: unless-stopped
  worker:
    build: *api_runtime_build
    image: ape-italia-api
    command: ["node", "dist/worker.js"]
    environment:
      <<: *db
      EVIDENCE_STORAGE_DIR: /var/lib/ape-italia/evidence
      EVIDENCE_ENCRYPTION_KEY: ${EVIDENCE_ENCRYPTION_KEY:-}
      RETENTION_APPLY: ${RETENTION_APPLY:-0}
      CLAMAV_HOST: clamav
    volumes: [evidence:/var/lib/ape-italia/evidence]
    depends_on: { migrate: { condition: service_completed_successfully } }
    restart: unless-stopped
  web:
    build: { context: .., dockerfile: apps/web/Dockerfile }
    image: ape-italia-web
    environment:
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-ape-italia-api}
      WEB_OIDC_CLIENT_ID: ${WEB_OIDC_CLIENT_ID:-}
      WEB_OIDC_CLIENT_SECRET: ${WEB_OIDC_CLIENT_SECRET:-}
      WEB_BASE_URL: ${WEB_BASE_URL:-}
      API_BASE_URL: ${API_BASE_URL:-}
      WEB_SESSION_KEY: ${WEB_SESSION_KEY:-}
    ports: ["127.0.0.1:3000:3000"]
    restart: unless-stopped
volumes:
  pgdata:
  evidence:
  uploads:
  caddy_data:
